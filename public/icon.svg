<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a7b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2744;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#oceanGrad)" stroke="#c4a35a" stroke-width="1"/>
  <!-- Anchor shape -->
  <g fill="none" stroke="#f5f5f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ring at top -->
    <circle cx="16" cy="8" r="2.5"/>
    <!-- Vertical shaft -->
    <line x1="16" y1="10.5" x2="16" y2="24"/>
    <!-- Horizontal bar (stock) -->
    <line x1="10" y1="14" x2="22" y2="14"/>
    <!-- Flukes (curved arms) -->
    <path d="M10 24 Q10 20, 16 20"/>
    <path d="M22 24 Q22 20, 16 20"/>
  </g>
</svg>
